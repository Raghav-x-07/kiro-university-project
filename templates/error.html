{% extends "base.html" %}

{% block title %}Error - Cloud Asset & Health Auditor{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 text-center">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>An Error Occurred</h5>
                </div>
                <div class="card-body py-5">
                    <i class="fas fa-bug text-danger fa-4x mb-4"></i>
                    <h4>Something went wrong</h4>
                    <p class="text-muted">{{ error }}</p>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-3">
                        <i class="fas fa-home me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
